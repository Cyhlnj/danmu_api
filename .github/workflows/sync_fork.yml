name: Fork Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Merge upstream
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/huangxd-/danmu_api.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$conflicts" != ".github/workflows/sync_fork.yml" ]; then
            echo "::error::Unexpected merge conflicts:"
            printf '%s\n' "$conflicts"
            git merge --abort
            exit 1
          fi

          git checkout --ours -- .github/workflows/sync_fork.yml
          git add .github/workflows/sync_fork.yml
          git diff --check
          git commit --no-edit
          git push origin HEAD:main
